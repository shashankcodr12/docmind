services:
  # Spring Boot Backend
  - type: web
    name: docmind-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
